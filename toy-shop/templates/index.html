<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kratos Toy Shop</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="app-bar">
        <div class="container">
            <h1>🎮 Kratos Toy Shop</h1>
            <a href="{{ url_for('view_cart') }}" class="btn btn-outline" style="float: right; color: white; border-color: white;">
                <span class="material-icons">shopping_cart</span>
                Cart <span class="cart-badge">{{ cart_count }}</span>
            </a>
        </div>
    </header>

    <main class="container">
        <div class="text-center mb-2 fade-in">
            <h2 style="font-size: 2.5rem; margin-bottom: 1rem;">Welcome to Our Toy Store</h2>
            <p style="font-size: 1.2rem; color: var(--text-secondary);">Discover amazing toys for everyone</p>
        </div>

        <div class="products">
            {% for product in products %}
            <div class="product fade-in">
                <img src="{{ url_for('static', filename='images/' + product.image) }}" alt="{{ product.name }}">
                <h2>{{ product.name }}</h2>
                <div class="product-price">${{ "%.2f"|format(product.price) }}</div>
                <a href="{{ url_for('add_to_cart', product_id=product.id) }}" class="btn btn-primary">
                    <span class="material-icons">add_shopping_cart</span>
                    Add to Cart
                </a>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
